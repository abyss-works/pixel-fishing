name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      # 실제 Postgres 테스트 — 호스팅 러너의 Docker로 Supabase Postgres 컨테이너를 띄운다
      - run: pnpm run test:db
      - run: pnpm exec tsc -b
      - run: pnpm run lint
      - run: pnpm run build
