name: CI

on:
  push:
    branches: [main, dev]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      # 실제 Postgres 테스트 — 호스팅 러너의 Docker로 Supabase Postgres 컨테이너를 띄운다
      - run: pnpm run test:db
      - run: pnpm exec tsc -b
      - run: pnpm run lint
      - run: pnpm run build

  # main 푸시마다 운영 이미지를 빌드해 올린다. ArgoCD가 k8s/prod의 태그를 보고 배포한다.
  image:
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Check image tag matches package version
        run: |
          TAG="v$(node -p 'require("./package.json").version')"
          grep -q "newTag: ${TAG}$" k8s/prod/kustomization.yaml || { echo "k8s/prod/kustomization.yaml newTag must be ${TAG}"; exit 1; }
          echo "TAG=${TAG}" >> "${GITHUB_ENV}"
      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${GITHUB_ACTOR}" --password-stdin
      - name: Build and push image
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
          VITE_SENTRY_DSN: ${{ vars.VITE_SENTRY_DSN }}
          VITE_SENTRY_ENV: ${{ vars.VITE_SENTRY_ENV }}
        run: |
          IMAGE="ghcr.io/${GITHUB_REPOSITORY}:${TAG}"
          docker build -t "${IMAGE}" \
            --label "org.opencontainers.image.source=https://github.com/${GITHUB_REPOSITORY}" \
            --build-arg BUILD_ID="${GITHUB_SHA}" \
            --build-arg DEPLOY_ENV=production \
            --build-arg VITE_SUPABASE_URL \
            --build-arg VITE_SUPABASE_ANON_KEY \
            --build-arg VITE_SENTRY_DSN \
            --build-arg VITE_SENTRY_ENV \
            .
          docker push "${IMAGE}"

  # dev 푸시마다 스테이징 이미지를 빌드해 올리고 k8s/stage의 태그를 갱신한다. ArgoCD가 dev의 k8s/stage를 보고 배포한다.
  stage-image:
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
    runs-on: ubuntu-24.04-arm
    concurrency:
      group: stage-image
      cancel-in-progress: false
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${GITHUB_ACTOR}" --password-stdin
      - name: Build and push image
        env:
          VITE_SUPABASE_URL: ${{ vars.STAGE_VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.STAGE_VITE_SUPABASE_ANON_KEY }}
          VITE_SENTRY_DSN: ${{ vars.STAGE_VITE_SENTRY_DSN }}
          VITE_SENTRY_ENV: ${{ vars.STAGE_VITE_SENTRY_ENV }}
        run: |
          TAG="dev-${GITHUB_SHA::7}"
          IMAGE="ghcr.io/${GITHUB_REPOSITORY}:${TAG}"
          docker build -t "${IMAGE}"             --label "org.opencontainers.image.source=https://github.com/${GITHUB_REPOSITORY}"             --build-arg BUILD_ID="${GITHUB_SHA}"             --build-arg DEPLOY_ENV=preview             --build-arg VITE_SUPABASE_URL             --build-arg VITE_SUPABASE_ANON_KEY             --build-arg VITE_SENTRY_DSN             --build-arg VITE_SENTRY_ENV             .
          docker push "${IMAGE}"
          echo "TAG=${TAG}" >> "${GITHUB_ENV}"
      - name: Update stage image tag
        run: |
          sed -i "s|newTag: .*|newTag: ${TAG}|" k8s/stage/kustomization.yaml
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add k8s/stage/kustomization.yaml
          git commit -F - <<EOF
          ci(k8s): 스테이징 이미지 태그를 ${TAG}로 갱신

          - k8s/stage/kustomization.yaml: 스테이징 이미지 태그를 ${TAG}로 지정한다.
          EOF
          git pull --rebase origin dev
          git push origin HEAD:dev
