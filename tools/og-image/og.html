<!doctype html>
<!-- 링크 미리보기 대표 그림(1200x630) 원본. 다시 만들 때:
     "C:\Program Files\Google\Chrome\Application\chrome.exe" --headless=new --disable-gpu --hide-scrollbars --window-size=1200,630 --screenshot=public/og.png file:///<제품 저장소 절대 경로>/tools/og-image/og.html
     (상대 경로만 주면 주소로 해석되어 실패하므로 file:/// 주소로 연다. 글꼴은 저장소의 파일을 상대 경로로 읽으므로 네트워크가 필요 없다) -->
<html lang="ko">
<head>
<meta charset="utf-8">
<style>
  @font-face {
    font-family: 'Silkscreen'; font-style: normal; font-weight: 700; font-display: block;
    src: url('../../src/presentation/ui/fonts/silkscreen/silkscreen-700-latin.woff2') format('woff2');
  }
  html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; }
  body {
    background: radial-gradient(ellipse at 50% 70%, #1b5a8a, #0a2240);
    display: flex; align-items: center; justify-content: center;
    image-rendering: pixelated;
  }
  b { font-family: 'Silkscreen', monospace; font-weight: 700; font-size: 96px; letter-spacing: 4px; color: #ffd54f; text-shadow: 0 8px 0 #000; }
</style>
</head>
<body><b>PIXEL FISHING</b></body>
</html>
