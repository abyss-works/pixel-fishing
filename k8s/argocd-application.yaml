apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: pixel-fishing-prod
  namespace: argocd
spec:
  destination:
    namespace: pixel-fishing-prod
    server: https://kubernetes.default.svc
  project: pixel-fishing
  source:
    path: k8s/prod
    repoURL: https://github.com/abyss-works/pixel-fishing
    targetRevision: main
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
