apiVersion: batch/v1
kind: CronJob
metadata:
  name: purge-anon
spec:
  schedule: "30 18 * * *"
  timeZone: Etc/UTC
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      backoffLimit: 0
      template:
        spec:
          restartPolicy: Never
          containers:
            - name: trigger
              image: curlimages/curl:8.11.1
              env:
                - name: CRON_SECRET
                  valueFrom:
                    secretKeyRef:
                      name: pixel-fishing
                      key: CRON_SECRET
              command:
                - sh
                - -c
                - 'curl -fsS -m 900 -H "Authorization: Bearer $CRON_SECRET" http://pixel-fishing/api/cron/purge-anon'
