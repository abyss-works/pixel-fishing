apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: pixel-fishing
  annotations:
    # 정적 파일과 화면 경로. 본문 한도는 같은 호스트의 다른 경로와 같은 값으로 둔다. 요청 한도는 Ingress 단위라 경로별로 나눈다.
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: 5m
    nginx.ingress.kubernetes.io/limit-rps: "50"
    nginx.ingress.kubernetes.io/limit-burst-multiplier: "6"
    nginx.ingress.kubernetes.io/default-backend: "pixel-fishing-errors"
    nginx.ingress.kubernetes.io/custom-http-errors: "502,503,504"
spec:
  ingressClassName: nginx
  rules:
    - host: pixel-fishing.abyssworks.dev
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: pixel-fishing
                port:
                  number: 80
  tls:
    - hosts:
        - pixel-fishing.abyssworks.dev
      secretName: pixel-fishing-tls
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: pixel-fishing-api
  annotations:
    # 게임 서버 API(관리자 API는 pixel-fishing-admin-api, 익명 가입은 pixel-fishing-auth-anon으로 분리). import 액션이 게임 상태 전체를 싣는다. 본문 한도는 서버 본문 한도(5mb)와 맞춘다.
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: 5m
    nginx.ingress.kubernetes.io/limit-rps: "100"
    nginx.ingress.kubernetes.io/limit-burst-multiplier: "5"
spec:
  ingressClassName: nginx
  rules:
    - host: pixel-fishing.abyssworks.dev
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: pixel-fishing
                port:
                  number: 80
  tls:
    - hosts:
        - pixel-fishing.abyssworks.dev
      secretName: pixel-fishing-tls
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: pixel-fishing-auth-anon
  annotations:
    # 익명 계정 생성 전용 경로. 공유 NAT 환경의 동시 접속을 수용하면서 연결 IP 기준 분당 요청 수를 제한한다.
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: 5m
    nginx.ingress.kubernetes.io/limit-rpm: "30"
    nginx.ingress.kubernetes.io/limit-burst-multiplier: "5"
spec:
  ingressClassName: nginx
  rules:
    - host: pixel-fishing.abyssworks.dev
      http:
        paths:
          - path: /api/auth/sign-in/anonymous
            pathType: Prefix
            backend:
              service:
                name: pixel-fishing
                port:
                  number: 80
  tls:
    - hosts:
        - pixel-fishing.abyssworks.dev
      secretName: pixel-fishing-tls
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: pixel-fishing-admin-api
  annotations:
    # 관리자 API(/api/admin). 게임 API(/api)와 요청 한도 버킷을 분리해 대시보드 조회가 게임 한도에 걸리지 않게 한다.
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: 5m
    nginx.ingress.kubernetes.io/limit-rps: "50"
    nginx.ingress.kubernetes.io/limit-burst-multiplier: "6"
spec:
  ingressClassName: nginx
  rules:
    - host: pixel-fishing.abyssworks.dev
      http:
        paths:
          - path: /api/admin
            pathType: Prefix
            backend:
              service:
                name: pixel-fishing
                port:
                  number: 80
  tls:
    - hosts:
        - pixel-fishing.abyssworks.dev
      secretName: pixel-fishing-tls
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: pixel-fishing-live
  annotations:
    # 실시간 연결(WebSocket 업그레이드). 공유 NAT 환경의 동시 재연결을 수용할 수준으로 연결 시도 빈도를 제한한다.
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: 5m
    nginx.ingress.kubernetes.io/limit-rps: "10"
    nginx.ingress.kubernetes.io/limit-burst-multiplier: "10"
spec:
  ingressClassName: nginx
  rules:
    - host: pixel-fishing.abyssworks.dev
      http:
        paths:
          - path: /api/live
            pathType: Prefix
            backend:
              service:
                name: pixel-fishing-realtime
                port:
                  number: 80
  tls:
    - hosts:
        - pixel-fishing.abyssworks.dev
      secretName: pixel-fishing-tls
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: pixel-fishing-admin
  annotations:
    # 관리자 대시보드는 별도 이미지로 배포한다.
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: 5m
    nginx.ingress.kubernetes.io/limit-rps: "50"
    nginx.ingress.kubernetes.io/limit-burst-multiplier: "6"
spec:
  ingressClassName: nginx
  rules:
    - host: pixel-fishing.abyssworks.dev
      http:
        paths:
          - path: /admin
            pathType: Prefix
            backend:
              service:
                name: pixel-fishing-admin
                port:
                  number: 80
  tls:
    - hosts:
        - pixel-fishing.abyssworks.dev
      secretName: pixel-fishing-tls
