apiVersion: apps/v1
kind: Deployment
metadata:
  name: pixel-fishing-realtime
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: pixel-fishing-realtime
  template:
    metadata:
      labels:
        app: pixel-fishing-realtime
    spec:
      terminationGracePeriodSeconds: 35
      nodeSelector:
        kubernetes.io/arch: arm64
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: pixel-fishing-realtime
      dnsConfig:
        options:
          - name: ndots
            value: "1"
      containers:
        - name: pixel-fishing-realtime
          image: ghcr.io/abyss-works/pixel-fishing
          command: ["node", "dist-ssr/realtimeMain.js"]
          envFrom:
            - secretRef:
                name: pixel-fishing
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: pixel-fishing-db-app
                  key: fqdn-uri
            - name: BETTER_AUTH_URL
              value: https://pixel-fishing.abyssworks.dev
            - name: DEPLOY_ENV
              value: production
            - name: CONSENT_EFFECTIVE_DATE
              value: "2026-11-25"
            - name: REDIS_URL
              value: redis://pixel-fishing-valkey:6379
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
          ports:
            - containerPort: 3000
          lifecycle:
            preStop:
              exec:
                command: ["sh", "-c", "sleep 5"]
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /healthz
              port: 3000
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 6
---
apiVersion: v1
kind: Service
metadata:
  name: pixel-fishing-realtime
spec:
  type: ClusterIP
  selector:
    app: pixel-fishing-realtime
  ports:
    - port: 80
      targetPort: 3000
