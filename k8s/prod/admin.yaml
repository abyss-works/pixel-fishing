# 관리자 대시보드 — 정적 번들만 서빙한다. 인그레스가 게임과 같은 호스트의 /admin 경로를 이 서비스로 보내고,
# 대시보드는 같은 오리진의 게임 API(/api/admin/*)를 로그인 쿠키로 호출한다.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pixel-fishing-admin
spec:
  replicas: 1
  selector:
    matchLabels:
      app: pixel-fishing-admin
  template:
    metadata:
      labels:
        app: pixel-fishing-admin
    spec:
      nodeSelector:
        kubernetes.io/hostname: oci-node
      containers:
        - name: pixel-fishing-admin
          image: ghcr.io/abyss-works/pixel-fishing-admin
          ports:
            - containerPort: 8080
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 200m
              memory: 64Mi
          readinessProbe:
            httpGet:
              path: /admin/
              port: 8080
            periodSeconds: 10
            timeoutSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: pixel-fishing-admin
spec:
  type: ClusterIP
  selector:
    app: pixel-fishing-admin
  ports:
    - name: http
      port: 80
      targetPort: 8080
