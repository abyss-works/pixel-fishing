apiVersion: apps/v1
kind: Deployment
metadata:
  name: pixel-fishing
spec:
  replicas: 1
  selector:
    matchLabels:
      app: pixel-fishing
  template:
    metadata:
      labels:
        app: pixel-fishing
    spec:
      nodeSelector:
        kubernetes.io/hostname: oci-node
      # 노드의 search 도메인이 SERVFAIL을 돌려주면 musl은 외부 이름 조회 전체를 실패시킨다.
      # 점이 있는 이름은 절대 이름부터 조회하게 한다.
      dnsConfig:
        options:
          - name: ndots
            value: "1"
      containers:
        - name: pixel-fishing
          image: ghcr.io/abyss-works/pixel-fishing
          # 서버 환경 변수(DB 연결, Supabase 키, CRON_SECRET, R2, Sentry)는 저장소 밖에서 만든 Secret이 준다.
          envFrom:
            - secretRef:
                name: pixel-fishing
          ports:
            - containerPort: 3000
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 1Gi
          readinessProbe:
            httpGet:
              path: /api/action
              port: 3000
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            tcpSocket:
              port: 3000
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 6
