apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# 운영 구성을 그대로 쓰고 네임스페이스·환경 라벨·도메인·이미지 태그만 바꾼다. 예약 작업은 두지 않는다.
namespace: pixel-fishing-stage
resources:
  - ../prod
  - pvc-mockups.yaml
labels:
  - pairs:
      abyssworks.dev/environment: stage
patches:
  - target:
      kind: Namespace
      name: pixel-fishing-prod
    patch: |-
      - op: replace
        path: /metadata/name
        value: pixel-fishing-stage
  # 경로별로 나눈 Ingress 전부에 적용한다.
  - target:
      kind: Ingress
    patch: |-
      - op: replace
        path: /spec/rules/0/host
        value: pixel-fishing-preview.abyssworks.dev
      - op: replace
        path: /spec/tls/0/hosts/0
        value: pixel-fishing-preview.abyssworks.dev
  - target:
      kind: Certificate
      name: pixel-fishing-tls
    patch: |-
      - op: replace
        path: /spec/dnsNames/0
        value: pixel-fishing-preview.abyssworks.dev
  - target:
      kind: Deployment
      name: pixel-fishing
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/env/1/value
        value: https://pixel-fishing-preview.abyssworks.dev
      - op: replace
        path: /spec/template/spec/containers/0/env/2/value
        value: preview
      # 약관과 처리방침의 판이자 시행일(YYYY-MM-DD).
      - op: replace
        path: /spec/template/spec/containers/0/env/3/value
        value: "2026-11-25"
      # 스테이징 전용 시안 HTML 디렉터리 경로(아래 볼륨 마운트와 맞춘다).
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: MOCKUPS_DIR
          value: /data/mockups
  # 같은 노드를 쓰는 운영의 CPU 몫을 지키려고 스테이징 한도 합계를 1.55코어로 묶는다(앱 400m + DB 400m + 관리자 200m + Valkey 200m + 실시간 150m×2 + 오류 50m).
  - target:
      kind: Deployment
      name: pixel-fishing
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/cpu
        value: 400m
  # 스테이징 시안 PVC는 RWO이므로 롤아웃 교착을 피하려고 Recreate 전략과 fsGroup 1000(node)을 쓴다.
  - target:
      kind: Deployment
      name: pixel-fishing
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: pixel-fishing
      spec:
        replicas: 1
        strategy:
          type: Recreate
          rollingUpdate: null
        template:
          spec:
            securityContext:
              fsGroup: 1000
            volumes:
              - name: mockups
                persistentVolumeClaim:
                  claimName: pixel-fishing-mockups
            containers:
              - name: pixel-fishing
                volumeMounts:
                  - name: mockups
                    mountPath: /data/mockups
  - target:
      kind: Cluster
      name: pixel-fishing-db
    patch: |-
      - op: add
        path: /spec/resources/limits/cpu
        value: 400m
  - target:
      kind: CronJob
    patch: |-
      $patch: delete
      apiVersion: batch/v1
      kind: CronJob
      metadata:
        name: unused
  - target:
      kind: Deployment
      name: pixel-fishing-errors
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 1
  - target:
      kind: Deployment
      name: pixel-fishing-valkey
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/memory
        value: 128Mi
      - op: replace
        path: /spec/template/spec/containers/0/args/6
        value: 96mb
  - target:
      kind: Deployment
      name: pixel-fishing-realtime
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/env/1/value
        value: https://pixel-fishing-preview.abyssworks.dev
      - op: replace
        path: /spec/template/spec/containers/0/env/2/value
        value: preview
      - op: replace
        path: /spec/template/spec/containers/0/env/3/value
        value: "2026-11-25"
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/cpu
        value: 150m
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/memory
        value: 192Mi
  - target:
      kind: Deployment
      name: pixel-fishing-admin
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/env/1/value
        value: https://pixel-fishing-preview.abyssworks.dev
      - op: replace
        path: /spec/template/spec/containers/0/env/2/value
        value: preview
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/memory
        value: 192Mi
# dev 푸시마다 CI가 게임과 관리자 이미지의 태그를 dev-<커밋 SHA 7자리>로 함께 갱신한다.
images:
  - name: ghcr.io/abyss-works/pixel-fishing
    newTag: dev-397881b
  - name: ghcr.io/abyss-works/pixel-fishing-admin
    newTag: dev-397881b
