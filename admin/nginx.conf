server {
    listen 8080;
    root /usr/share/nginx/html;
    # 인그레스 뒤에서 내부 포트와 스킴이 새지 않도록 이동 주소를 상대 경로로 둔다.
    absolute_redirect off;

    # 인그레스는 /admin 아래만 보낸다. 그 밖의 경로는 서빙하지 않는다.
    location / {
        return 404;
    }

    location = /admin {
        return 301 /admin/;
    }

    # 해시가 붙은 빌드 산출물만 오래 캐시한다.
    location /admin/assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # index.html은 매번 검증해 새 배포를 바로 받는다. 화면 경로는 해시로 나뉘므로 모든 주소가 index.html이다.
    location /admin/ {
        add_header Cache-Control "no-cache";
        try_files $uri /admin/index.html;
    }
}
